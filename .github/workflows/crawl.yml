name: Nexus CRE Intelligence — Crawler

on:
  schedule:
    - cron: "15 */2 * * *"        # every 2 hours at :15 (UTC)
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma list (blank = all): bse,nse,nse_board_meetings,bse_results,sec_fts,sec_form_d,ats,ir,news"
        required: false
        default: ""
      days:
        description: "Days back for filings"
        required: false
        default: "1"

concurrency:
  group: nexus-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest        # NSE/BSE may block cloud IPs — see README "India exchanges from the cloud"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Offline tests
        run: python -m pytest -q tests

      - name: Crawl
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT:            ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:              ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL:             ${{ vars.DASHBOARD_URL }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '1' }}"
          if [ -n "${{ github.event.inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ github.event.inputs.sources }}"; fi
          python main.py $ARGS

      - name: Upload run report + raw API samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report-${{ github.run_id }}
          path: |
            data/run_report.json
            data/raw/
          retention-days: 14
          if-no-files-found: ignore
